<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>سومه - حاسبة المعدل الجامعي</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #070919;

            background-image:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(30, 41, 89, 0.4),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(45, 27, 105, 0.3),
                    transparent 40%
                );

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            padding: 20px 10px;
        }

        .container {
            width: 100%;

            max-width: 480px;

            display: flex;

            flex-direction: column;

            gap: 20px;
        }

        /* HEADER */

        .header {
            text-align: center;

            margin-top: 10px;
        }

        .header i {
            font-size: 45px;

            color: #60a5fa;

            margin-bottom: 10px;

            filter:
                drop-shadow(
                    0 0 10px
                    rgba(96, 165, 250, 0.5)
                );
        }

        .header h1 {
            font-size: 32px;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #a78bfa,
                    #60a5fa
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;

            color: #94a3b8;
        }


        /* CARD */

        .card {
            background:
                rgba(15, 23, 42, 0.7);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 20px;

            padding: 20px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.5);
        }


        .card-title {
            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 8px;

            font-size: 16px;

            font-weight: 700;

            color: #38bdf8;

            margin-bottom: 15px;
        }


        /* INPUTS */

        .input-group {
            display: flex;

            align-items: center;

            background:
                rgba(30, 41, 59, 0.5);

            border:
                1px solid
                rgba(255, 255, 255, 0.07);

            border-radius: 12px;

            margin-bottom: 12px;

            padding: 0 12px;
        }

        .input-group input {
            width: 100%;

            background: transparent;

            border: none;

            outline: none;

            color: white;

            padding: 12px 8px;

            text-align: right;

            font-size: 14px;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        .input-group i {
            color: #94a3b8;
        }


        /* COURSE ROW */

        .course-row {
            display: grid;

            grid-template-columns:
                55px
                75px
                95px
                1fr;

            gap: 7px;

            align-items: center;

            margin-bottom: 10px;

            background:
                rgba(30, 41, 59, 0.4);

            padding: 10px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.05);
        }


        .course-name,
        .course-hours,
        .course-grade {
            width: 100%;

            background:
                rgba(15, 23, 42, 0.8);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 10px;

            padding: 10px;

            color: white;

            outline: none;

            font-size: 12px;
        }


        .course-name {
            text-align: right;
        }

        .course-hours,
        .course-grade {
            text-align: center;
        }


        .course-grade option {
            background: #0f172a;

            color: white;
        }


        /* DELETE */

        .btn-delete {
            width: 100%;

            background:
                rgba(239, 68, 68, 0.15);

            border:
                1px solid
                rgba(239, 68, 68, 0.3);

            color: #f87171;

            padding: 10px 5px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 11px;
        }

        .btn-delete:hover {
            background:
                rgba(239, 68, 68, 0.3);
        }


        /* ADD */

        .btn-add {
            width: 100%;

            background: transparent;

            border:
                1px dashed
                rgba(56, 189, 248, 0.5);

            color: #38bdf8;

            padding: 12px;

            border-radius: 12px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-add:hover {
            background:
                rgba(56, 189, 248, 0.08);
        }


        /* CALCULATE */

        .btn-calculate {
            width: 100%;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            border: none;

            color: white;

            padding: 15px;

            border-radius: 14px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 4px 20px
                rgba(6, 182, 212, 0.4);

            transition: 0.2s;
        }

        .btn-calculate:hover {
            transform: translateY(-2px);

            opacity: 0.9;
        }


        /* RESULTS */

        .results-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .result-box {
            background:
                rgba(15, 23, 42, 0.8);

            border:
                1px solid
                rgba(255, 255, 255, 0.08);

            border-radius: 16px;

            padding: 15px;

            text-align: center;
        }

        .result-box i {
            font-size: 24px;

            color: #38bdf8;

            margin-bottom: 8px;
        }

        .result-box .title {
            display: block;

            font-size: 12px;

            color: #94a3b8;
        }

        .result-box .value {
            display: block;

            font-size: 24px;

            font-weight: 800;

            color: #34d399;

            margin-top: 5px;
        }


        /* INFO */

        .calculation-info {
            background:
                rgba(56, 189, 248, 0.06);

            border:
                1px solid
                rgba(56, 189, 248, 0.15);

            border-radius: 14px;

            padding: 12px;

            text-align: center;

            font-size: 12px;

            color: #94a3b8;
        }


        /* FOOTER */

        .footer {
            display: flex;

            justify-content: space-between;

            font-size: 12px;

            color: #64748b;
        }

        .footer a {
            color: #38bdf8;

            text-decoration: none;
        }


        /* MOBILE */

        @media (max-width: 400px) {

            .course-row {
                grid-template-columns:
                    48px
                    65px
                    85px
                    1fr;

                gap: 5px;

                padding: 7px;
            }

            .course-name,
            .course-hours,
            .course-grade {
                padding: 8px 4px;

                font-size: 10px;
            }

            .btn-delete {
                padding: 8px 3px;

                font-size: 9px;
            }
        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <i class="fa-solid fa-graduation-cap"></i>

        <h1>سومه</h1>

        <p>
            حاسبة المعدل الجامعي الاحترافية (4.0)
        </p>

    </div>


    <!-- PREVIOUS -->

    <div class="card">

        <div class="card-title">

            بيانات الفصول السابقة (اختياري)

            <i class="fa-solid fa-chart-column"></i>

        </div>


        <div class="input-group">

            <input
                type="number"
                id="prevGpa"
                step="0.01"
                min="0"
                max="4"
                placeholder="المعدل السابق"
            >

            <i class="fa-regular fa-calendar"></i>

        </div>


        <div class="input-group">

            <input
                type="number"
                id="prevHours"
                min="0"
                placeholder="الساعات المكتسبة"
            >

            <i class="fa-regular fa-clock"></i>

        </div>


        <div class="input-group">

            <input
                type="number"
                id="prevPoints"
                min="0"
                placeholder="إجمالي النقاط"
            >

            <i class="fa-regular fa-star"></i>

        </div>

    </div>


    <!-- CURRENT COURSES -->

    <div class="card">

        <div class="card-title">

            مواد الفصل الحالي

            <i class="fa-solid fa-book-open"></i>

        </div>


        <div id="coursesList">


            <!-- المادة الأولى -->

            <div class="course-row">

                <button
                    type="button"
                    class="btn-delete"
                    onclick="removeCourse(this)"
                >
                    <i class="fa-solid fa-trash-can"></i>
                    حذف
                </button>


                <input
                    type="number"
                    class="course-hours"
                    min="1"
                    max="6"
                    value="3"
                    placeholder="الساعات"
                >


                <select class="course-grade">

                    <option value="4">
                        A+ (4.0)
                    </option>

                    <option value="3.75">
                        A (3.75)
                    </option>

                    <option value="3.5">
                        B+ (3.5)
                    </option>

                    <option value="3">
                        B (3.0)
                    </option>

                    <option value="2.5">
                        C+ (2.5)
                    </option>

                    <option value="2">
                        C (2.0)
                    </option>

                    <option value="1.5">
                        D+ (1.5)
                    </option>

                    <option value="1">
                        D (1.0)
                    </option>

                    <option value="0">
                        F (0.0)
                    </option>

                </select>


                <input
                    type="text"
                    class="course-name"
                    placeholder="اسم المادة"
                >

            </div>

        </div>


        <!-- ADD COURSE -->

        <button
            type="button"
            class="btn-add"
            onclick="addCourse()"
        >

            <i class="fa-solid fa-plus"></i>

            إضافة مادة أخرى

        </button>

    </div>


    <!-- CALCULATE -->

    <button
        type="button"
        class="btn-calculate"
        onclick="calculateGpa()"
    >

        <i class="fa-solid fa-calculator"></i>

        احسب المعدل بدقة

    </button>


    <!-- RESULTS -->

    <div class="results-grid">


        <div class="result-box">

            <i class="fa-solid fa-layer-group"></i>

            <span class="title">
                المعدل التراكمي الجديد
            </span>

            <span
                class="value"
                id="cumulativeGpa"
            >
                —
            </span>

        </div>


        <div class="result-box">

            <i class="fa-solid fa-chart-pie"></i>

            <span class="title">
                المعدل الفصلي الحالي
            </span>

            <span
                class="value"
                id="semesterGpa"
            >
                0.00
            </span>

        </div>

    </div>


    <!-- INFO -->

    <div class="calculation-info">

        <span id="calculationInfo">
            أدخل مواد الفصل الحالي واضغط على احسب المعدل
        </span>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            Design by Dazai
        </span>

        <span>

            Instagram:

            <a
                href="https://instagram.com/t_om_s1"
                target="_blank"
                rel="noopener noreferrer"
            >
                @t_om_s1
            </a>

        </span>

    </div>


</div>


<script>


/* =====================================================
   إضافة مادة جديدة
===================================================== */

function addCourse() {

    const coursesList =
        document.getElementById("coursesList");


    const courseRow =
        document.createElement("div");


    courseRow.className =
        "course-row";


    courseRow.innerHTML = `

        <button
            type="button"
            class="btn-delete"
            onclick="removeCourse(this)"
        >

            <i class="fa-solid fa-trash-can"></i>

            حذف

        </button>


        <input
            type="number"
            class="course-hours"
            min="1"
            max="6"
            value="3"
            placeholder="الساعات"
        >


        <select class="course-grade">

            <option value="4">
                A+ (4.0)
            </option>

            <option value="3.75">
                A (3.75)
            </option>

            <option value="3.5">
                B+ (3.5)
            </option>

            <option value="3">
                B (3.0)
            </option>

            <option value="2.5">
                C+ (2.5)
            </option>

            <option value="2">
                C (2.0)
            </option>

            <option value="1.5">
                D+ (1.5)
            </option>

            <option value="1">
                D (1.0)
            </option>

            <option value="0">
                F (0.0)
            </option>

        </select>


        <input
            type="text"
            class="course-name"
            placeholder="اسم المادة"
        >

    `;


    coursesList.appendChild(courseRow);

}



/* =====================================================
   حذف مادة
===================================================== */

function removeCourse(button) {

    const rows =
        document.querySelectorAll(".course-row");


    if (rows.length === 1) {

        alert(
            "يجب أن تبقى مادة واحدة على الأقل"
        );

        return;

    }


    button.closest(".course-row").remove();

}



/* =====================================================
   حساب المعدل
===================================================== */

function calculateGpa() {


    const rows =
        document.querySelectorAll(".course-row");


    let semesterPoints = 0;

    let semesterHours = 0;

    let validCourses = 0;



    /* ===============================================
       حساب جميع مواد الفصل الحالي
    =============================================== */

    rows.forEach(function(row) {


        const hoursElement =
            row.querySelector(".course-hours");


        const gradeElement =
            row.querySelector(".course-grade");


        const hours =
            parseFloat(hoursElement.value);


        const grade =
            parseFloat(gradeElement.value);



        if (
            isNaN(hours) ||
            hours <= 0
        ) {

            return;

        }


        if (
            isNaN(grade) ||
            grade < 0
        ) {

            return;

        }



        /* نقاط المادة */

        const coursePoints =
            hours * grade;



        /* إضافة المادة */

        semesterPoints +=
            coursePoints;


        semesterHours +=
            hours;


        validCourses++;

    });

       المعدل الفصلي
    =============================================== */

    let semesterGpa = 0;


    if (semesterHours > 0) {

        semesterGpa =
            semesterPoints /
            semesterHours;

    }


    document.getElementById(
        "semesterGpa"
    ).textContent =
        semesterGpa.toFixed(2);



    /* ===============================================
       بيانات المعدل السابق

    const prevGpaInput =
        document.getElementById(
            "prevGpa"

    const prevHoursInput =
        document.getElementById(
            "prevHours"
        );


    const prevPointsInput =
        document.getElementById(
            "prevPoints"
        );



    const prevGpa =
        parseFloat(
            prevGpaInput.value
        );


    const prevHours =
        parseFloat(
            prevHoursInput.value
        );


    const prevPoints =
        parseFloat(
            prevPointsInput.value
        );



    /* ===============================================
       هل توجد بيانات سابقة؟
    =============================================== */

    const hasPreviousGpa =
        prevGpaInput.value.trim() !== "" &&
        prevHoursInput.value.trim() !== "" &&
        !isNaN(prevGpa) &&
        !isNaN(prevHours) &&
        prevHours > 0;


    const hasPreviousPoints =
        prevPointsInput.value.trim() !== "" &&
        prevHoursInput.value.trim() !== "" &&
        !isNaN(prevPoints) &&
        !isNaN(prevHours) &&
        prevHours > 0;



    /* ===============================================
       حساب المعدل التراكمي
    =============================================== */

    let cumulativeGpa = null;



    /* إجمالي النقاط */

    if (hasPreviousPoints) {


        const totalPoints =
            prevPoints +
            semesterPoints;


        const totalHours =
            prevHours +
            semesterHours;


        if (totalHours > 0) {

            cumulativeGpa =
                totalPoints /
                totalHours;

        }

    }


    /* المعدل السابق */

    else if (hasPreviousGpa) {


        const previousTotalPoints =
            prevGpa *
            prevHours;


        const totalPoints =
            previousTotalPoints +
            semesterPoints;


        const totalHours =
            prevHours +
            semesterHours;


        if (totalHours > 0) {

            cumulativeGpa =
                totalPoints /
                totalHours;

        }

    }
